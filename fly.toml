# Fly.io config. Change `app` to your own unique name before deploying.
app = "parapharma-importer"
primary_region = "cdg"

[build]

[env]
  PORT = "8080"
  SHOPIFY_STORE = "n4k6ze-uf.myshopify.com"
  SHOPIFY_API_VERSION = "2025-07"
  SHOPIFY_ALLOW_WRITES = "true"
  SHOPIFY_ALLOW_PUBLISH = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
